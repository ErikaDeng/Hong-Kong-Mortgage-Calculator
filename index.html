/* 核心計算：每月等額供款，逐月還款表                                       */

function buildSchedule(principal, annualRatePct, years) {
  const n = Math.round(years * 12);
  const r = annualRatePct / 100 / 12;
  let monthly;
  if (r === 0) {
    monthly = principal / n;
  } else {
    const g = Math.pow(1 + r, n);
    monthly = (principal * r * g) / (g - 1);
  }
  const rows = [];
  let bal = principal;
  let cumInterest = 0;
  let totalInterest = 0;
  let totalPayment = 0;
  for (let k = 1; k <= n; k++) {
    const interest = bal * r;
    let prin;
    if (k === n) {
      prin = bal; // 最後一期：清償全部餘額
    } else {
      prin = Math.min(monthly - interest, bal);
      if (prin < 0) prin = 0;
    }
    const payment = prin + interest;
    bal = k === n ? 0 : Math.max(bal - prin, 0);
    cumInterest += interest;
    totalInterest += interest;
    totalPayment += payment;
    rows.push({
      k,
      year: Math.ceil(k / 12),
      payment,
      interest,
      principal: prin,
      balance: bal,
      cumInterest,
    });
  }
  return {
    n,
    monthly,
    rows,
    totalInterest,
    totalPayment,
    lastPayment: rows.length ? rows[rows.length - 1].payment : 0,
  };
}

function computeModel(f) {
  const e = {};

  /* --- 成交價、估值、估算基準 --- */
  const price = num(f.price);
  const priceErr = amountError(price, { required: true, allowZero: false });
  if (priceErr) e.price = priceErr;

  let valuation = price;
  if (!f.valuationLinked && f.valuation !== "") {
    const v = num(f.valuation);
    const err = amountError(v, { allowZero: false });
    if (err) e.valuation = err;
    else valuation = v;
  }
  const baseOk = !e.price && !e.valuation && price > 0 && valuation > 0;
  const base = baseOk ? Math.min(price, valuation) : null;

  /* --- 貸款金額與成數 --- */
  let loan = null;
  let ltvDisplay = f.ltv;
  let loanDisplay = f.loan;
  if (baseOk) {
    if (f.driver === "ltv") {
      const l = num(f.ltv);
      if (l === null) e.ltv = "請輸入按揭成數";
      else if (!Number.isFinite(l)) e.ltv = "請輸入有效數字";
      else if (l <= 0) e.ltv = "按揭成數必須大於 0%";
      else if (l > 100) e.ltv = "按揭成數不可超過 100%（貸款不可超過估算基準）";
      else loan = round2((base * l) / 100);
      loanDisplay = l !== null && Number.isFinite(l) ? String(round2((base * l) / 100)) : "";
    } else {
      const a = num(f.loan);
      if (a === null) e.loan = "請輸入貸款金額";
      else if (!Number.isFinite(a)) e.loan = "請輸入有效數字";
      else if (a <= 0) e.loan = "貸款金額必須大於 0";
      else if (a > base)
        e.loan = `貸款金額超過估算基準 ${hkd(base)}，請調低貸款金額或檢查成交價／估值`;
      else loan = a;
      ltvDisplay = a !== null && Number.isFinite(a) && a >= 0 ? String(round2((a / base) * 100)) : "";
    }
  }

  /* --- 年期 --- */
  const yrs = num(f.years);
  if (yrs === null) e.years = "請輸入按揭年期";
  else if (!Number.isFinite(yrs)) e.years = "請輸入有效數字";
  else if (!Number.isInteger(yrs)) e.years = "年期請輸入整數年";
  else if (yrs < 1 || yrs > MAX_YEARS)

  /* --- 利率 --- */
  let rate = null;
  let rateFormula = "";
  let capApplied = false;
  if (f.mode === "direct") {
    const v = num(f.directRate);
    const err = pctError(v);
    if (err) e.directRate = err;
    else {
      rate = v;
      rateFormula = `年利率 = ${rateText(v)}（用戶直接輸入）`;

    if (es) e.spread = es;

    const ep = pctError(p);
    const er = pctError(red);

    if (er) e.primeReduction = er;

    rate = null;

  /* --- 費用與保費 --- */
  const feeKeys = ["stamp", "legal", "agent", "other", "premium"];
  const fees = {};
  feeKeys.forEach((k) => {
    const v = num(f[k]);
    const err = amountError(v);
    if (err) e[k] = err;
    fees[k] = v === null || err ? 0 : v;

  /* --- 收入與債務（選填，不阻擋計算） --- */
  const incomeRaw = num(f.income);
  const debtRaw = num(f.debt);
  const incomeErr = amountError(incomeRaw);
  const debtErr = amountError(debtRaw);

  if (debtErr) warnings.debt = debtErr;

  const common = {
    errors: e,
    warnings,
    price,
    valuation,
    base,
    ltvDisplay,
    loanDisplay,
    rate,
    rateFormula,
    capApplied,

  const cashPremium = f.premiumMode === "cash" ? fees.premium : 0;
  const principal = loan + financedPremium;
  const down = price - loan;
  const otherCash = fees.stamp + fees.legal + fees.agent + fees.other;
  const cashNeed = down + otherCash + cashPremium;

  const sched = buildSchedule(principal, rate, yrs);

  const dsrOf = (monthly) =>
    income !== null && income > 0 ? ((monthly + debt) / income) * 100 : null;

  const scenarios = [0, 1, 2].map((add) => {
    const r = rate + add;
    const s = add === 0 ? sched : buildSchedule(principal, r, yrs);
    return {
      label: add === 0 ? "目前利率" : `目前利率 +${add} 個百分點`,
      rate: r,
      monthly: s.monthly,
      increase: s.monthly - sched.monthly,
      totalInterest: s.totalInterest,
      dsr: dsrOf(s.monthly),

  // 年度彙總
  const annual = [];
  const balanceData = [{ year: 0, balance: principal }];
  for (let y = 1; y <= yrs; y++) {
    const slice = sched.rows.slice((y - 1) * 12, y * 12);
    annual.push({
      year: y,
      principal: slice.reduce((a, r) => a + r.principal, 0),
      interest: slice.reduce((a, r) => a + r.interest, 0),
    });
    balanceData.push({ year: y, balance: slice[slice.length - 1].balance });
  }

  return {
    ...common,
    ok: true,
    years: yrs,
    loan,
    ltvBase: (loan / base) * 100,
    ltvPrice: (loan / price) * 100,
    fees,
    financedPremium,
    cashPremium,
    otherCash,
    principal,
    down,
    cashNeed,
    sched,
    scenarios,
    annual,
    balanceData,
    income,
    debt,
    dsr: dsrOf(sched.monthly),
  };
}

function downloadCsv(rows) {
  const header = [
    "期數",
    "年度",
    "月供 (HKD)",
    "當月利息 (HKD)",
    "當月本金 (HKD)",
    "剩餘本金 (HKD)",
    "累計利息 (HKD)",
  ];
  const lines = [header.join(",")];
  rows.forEach((r) => {
    lines.push(
      [
        r.k,
        r.year,
        r.payment.toFixed(2),
        r.interest.toFixed(2),
        r.principal.toFixed(2),
        r.balance.toFixed(2),
        r.cumInterest.toFixed(2),
      ].join(",")
    );
  });
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], {
    type: "text/csv;charset=utf-8;",
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "hk-mortgage-schedule.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
